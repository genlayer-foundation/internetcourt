<!DOCTYPE html>
<!--
  Generator for /media/blog/founding-members-by-layer.png
  Embedded in: frontend/src/content/blog/en/internet-court-agentic-commerce.mdx

  Founding members grouped by layer, six rows, each member once. The six rows
  use the SAME layer labels and order as the homepage stack image
  (agentic-stack.html / STACK_ROWS): 01 Discovery, identity & reputation;
  02 Negotiation; 03 Contracts & obligations; 04 Payment & escrow; 05 Execution;
  06 Verification & disputes. Each member's real logo is pulled from
  frontend/public/partners/ and rendered as a monochrome silhouette via CSS
  filter: grayscale(1) brightness(0); opacity: 0.72.

  SIZING RULE (matches the homepage partner grid):
  Every logo's height is its `gridHeight` from FOUNDING_MEMBERS_GRID in
  frontend/src/lib/site-content.ts, multiplied by the homepage desktop
  multiplier (SCALE = 1.5 in frontend/src/components/site/PartnerGrid.tsx),
  then by a single uniform infographic scale factor of 1.35 applied to every
  logo (so the image reads crisply at 2x without changing any ratios). The net
  per-logo multiplier is therefore 1.5 * 1.35 = 2.025, and the RELATIVE heights
  of logos here equal the ratios of their gridHeight values exactly, just as on
  the homepage. Heights are set inline (px); width follows via object-fit:
  contain, so wordmarks stay wider. Do NOT hand-tune individual logos: if a
  gridHeight changes in site-content.ts, recompute its px height (gridHeight *
  2.025) and re-render.

  Kleros is NOT in FOUNDING_MEMBERS_GRID (it is a dispute standard, not a
  founding member). It is assigned a manual gridHeight of 14, equal to UMA's
  value, so it sits proportionally next to its neighbor. px = 14 * 2.025 = 28.35.

  Logo source path: frontend/public/partners/ (referenced below relative to this
  file as ../../public/partners/...). The grouping here is the source of truth
  for this image; if the roster or grouping changes, update the rows below and
  the article text, then re-render.

  IMPORTANT: headless Chrome will not load file:// image sources unless you pass
  --allow-file-access-from-files (included in the command below). Alternatively,
  copy the partners/ folder next to this HTML and change the src paths to
  partners/... .

  Render command (macOS system headless Chrome, 2x device scale):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --allow-file-access-from-files --window-size=1280,866 --screenshot="/Users/rasca/Dev/moltcourt2/frontend/public/media/blog/founding-members-by-layer.png" "file:///Users/rasca/Dev/moltcourt2/frontend/tools/blog-images/founding-members-by-layer.html"

  Output: 1280x866 CSS layout rendered at 2x, so the PNG is 2560x1732.
  The window height (866) was measured to fit the content tightly. If members
  or their gridHeights change, re-measure the rendered content height and update
  --window-size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  #stage {
    width: 1280px;
    background: #FFFFFF;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .rows { display: flex; flex-direction: column; gap: 16px; }
  .row {
    display: flex;
    align-items: center;
    background: #f3f3f2;
    border-radius: 12px;
    padding: 20px 26px;
    gap: 24px;
  }
  .label {
    width: 250px;
    flex: 0 0 250px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #dc2626;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .label-text {
    color: #1a1817;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  /* Logos wrap and are vertically centered on a common center line within the
     row, so varied logo heights still read tidily. */
  .logos {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 30px 40px;
    row-gap: 26px;
  }
  /* Height is set per-logo inline (gridHeight * 2.025 px); the shared rules
     below carry the monochrome treatment and let width follow the height. */
  .logos img {
    width: auto;
    max-width: 200px;
    object-fit: contain;
    filter: grayscale(1) brightness(0);
    opacity: 0.72;
    display: block;
  }
</style>
</head>
<body>
<div id="stage">
  <div class="rows">

    <div class="row">

        <img src="../../public/partners/starknet.svg" style="height:32.4px">

    <div class="row">

      <div class="logos">

        <img src="../../public/partners/metamask.svg" style="height:44.55px">
        <img src="../../public/partners/privy.svg" style="height:34.222px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">05</div><div class="label-text">Execution</div></div>

  </div>
</div>
</body>
</html>
