<!DOCTYPE html>
<!--
  Generator for /media/blog/founding-members-by-layer.png
  Embedded in: frontend/src/content/blog/en/internet-court-agentic-commerce.mdx

  Founding members grouped by layer, six rows, each member once. The six rows
  use the SAME layer labels and order as the homepage stack image
  (agentic-stack.html / STACK_ROWS): 01 Discovery, identity & reputation;
  02 Negotiation; 03 Contracts & obligations; 04 Payment & escrow; 05 Execution;
  06 Verification & disputes. Each member's real logo is pulled from
  frontend/public/partners/ and rendered monochrome via CSS filter, matching
  the homepage partner grid two-tier treatment (see below); opacity: 0.6.

  SIZING RULE (matches the homepage partner grid EXACTLY):
  Every logo's height is its `gridHeight` from FOUNDING_MEMBERS_GRID in
  frontend/src/lib/site-content.ts, multiplied by the homepage desktop
  multiplier (SCALE = 1.75 in frontend/src/components/site/PartnerGrid.tsx).
  There is NO extra infographic boost: the net per-logo multiplier is 1.75,
  identical to the home grid, so logos are sized the same as on the homepage.
  The RELATIVE heights of logos here equal the ratios of their gridHeight
  values exactly. Heights are set inline (px); width follows via object-fit:
  contain, so wordmarks stay wider. Do NOT hand-tune individual logos: if a
  gridHeight changes in site-content.ts, recompute its px height (gridHeight *
  1.75) and re-render.

  FILTER TREATMENT (two-tier, matching PartnerGrid):
  - default (colored/dark marks): filter: grayscale(1)
  - white/light-on-transparent marks (flagged `white: true` in site-content.ts:
    x402, AppLayer, LI.FI, Humanode, Collective Memory, AIVM): filter:
    brightness(0), applied via class="white" on the <img>.
  This keeps solid-fill marks (Starknet, Anoma, etc.) as recognizable grey,
  instead of crushing them to featureless black.

  Kleros is in FOUNDING_MEMBERS_GRID with gridHeight 16 (same as UMA is 14).
  px = 16 * 1.75 = 28.

  Logo source path: frontend/public/partners/ (referenced below relative to this
  file as ../../public/partners/...). The grouping here is the source of truth
  for this image; if the roster or grouping changes, update the rows below and
  the article text, then re-render.

  IMPORTANT: headless Chrome will not load file:// image sources unless you pass
  --allow-file-access-from-files (included in the command below). Alternatively,
  copy the partners/ folder next to this HTML and change the src paths to
  partners/... .

  Render command (macOS system headless Chrome, 2x device scale):
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=2 --allow-file-access-from-files --window-size=1280,694 --screenshot="/Users/rasca/Dev/moltcourt2/frontend/public/media/blog/founding-members-by-layer.png" "file:///Users/rasca/Dev/moltcourt2/frontend/tools/blog-images/founding-members-by-layer.html"

  Output: 1280x694 CSS layout rendered at 2x, so the PNG is 2560x1388.
  The window height (694) was measured to fit the content tightly. If members
  or their gridHeights change, re-measure the rendered content height and update
  --window-size.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #FFFFFF; }
  #stage {
    width: 1280px;
    background: #FFFFFF;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .rows { display: flex; flex-direction: column; gap: 14px; }
  .row {
    display: flex;
    align-items: center;
    background: #f3f3f2;
    border-radius: 12px;
    padding: 16px 26px;
    gap: 24px;
  }
  .label {
    width: 250px;
    flex: 0 0 250px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .badge {
    flex: 0 0 auto;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: #dc2626;
    color: #ffffff;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: 0.02em;
  }
  .label-text {
    color: #1a1817;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  /* Logos wrap and are vertically centered on a common center line within the
     row, so varied logo heights still read tidily. */
  .logos {
    flex: 1 1 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 22px 38px;
    row-gap: 22px;
  }
  /* Height is set per-logo inline (gridHeight * 1.75 px, the home grid SCALE);
     the shared rules below carry the monochrome treatment and let width follow
     the height. Two-tier filter matches PartnerGrid: colored/dark marks get a
     tonal grayscale(1); white marks (class="white") get brightness(0). */
  .logos img {
    width: auto;
    max-width: 200px;
    object-fit: contain;
    filter: grayscale(1);
    opacity: 0.6;
    display: block;
  }
  .logos img.white {
    filter: brightness(0);
  }
</style>
</head>
<body>
<div id="stage">
  <div class="rows">

    <div class="row">
      <div class="label"><div class="badge">01</div><div class="label-text">Discovery, identity &amp; reputation</div></div>
      <div class="logos">
        <img src="../../public/partners/0g-labs.svg" style="height:31.5px">
        <img src="../../public/partners/nansen.png" style="height:28px">
        <img src="../../public/partners/collective-memory.png" class="white" style="height:38.5px">
        <img src="../../public/partners/altlayer.svg" style="height:28px">
        <img src="../../public/partners/chainbase.svg" style="height:27.65px">
        <img src="../../public/partners/humanode.svg" style="height:26.25px">
        <img src="../../public/partners/humanity-protocol.svg" style="height:38.325px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">02</div><div class="label-text">Negotiation</div></div>
      <div class="logos">
        <img src="../../public/partners/anoma.png" style="height:29.75px">
        <img src="../../public/partners/openserv.svg" style="height:38.5px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">03</div><div class="label-text">Contracts &amp; obligations</div></div>
      <div class="logos">
        <img src="../../public/partners/near.svg" style="height:28px">
        <img src="../../public/partners/starknet.svg" style="height:28px">
        <img src="../../public/partners/zksync.svg" style="height:33.075px">
        <img src="../../public/partners/arkhai.svg" style="height:37.975px">
        <img src="../../public/partners/bnb-chain.svg" style="height:26.95px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">04</div><div class="label-text">Payment &amp; escrow</div></div>
      <div class="logos">
        <img src="../../public/partners/metamask.svg" style="height:38.5px">
        <img src="../../public/partners/okx.svg" style="height:24.5px">
        <img src="../../public/partners/x402.svg" class="white" style="height:28px">
        <img src="../../public/partners/privy.svg" style="height:29.575px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">05</div><div class="label-text">Execution</div></div>
      <div class="logos">
        <img src="../../public/partners/antseed.svg" style="height:35px">
        <img src="../../public/partners/applayer.svg" class="white" style="height:26.775px">
        <img src="../../public/partners/lifi.svg" class="white" style="height:38.5px">
        <img src="../../public/partners/io-net.svg" style="height:24.5px">
        <img src="../../public/partners/heurist.svg" style="height:28px">
        <img src="../../public/partners/chutes.svg" style="height:24.0625px">
        <img src="../../public/partners/chaingpt.svg" style="height:28px">
      </div>
    </div>

    <div class="row">
      <div class="label"><div class="badge">06</div><div class="label-text">Verification &amp; disputes</div></div>
      <div class="logos">
        <img src="../../public/partners/genlayer.svg" style="height:42px">
        <!-- Kleros gridHeight 16 in FOUNDING_MEMBERS_GRID; px = 16 * 1.75 -->
        <img src="../../public/partners/kleros.svg" style="height:28px">
        <img src="../../public/partners/uma.svg" style="height:24.5px">
      </div>
    </div>

  </div>
</div>
</body>
</html>
