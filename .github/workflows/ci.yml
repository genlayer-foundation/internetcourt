name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install genlayer-test
          pip install -r contracts/requirements.txt || true
      - name: Run contract tests
        run: |
          cd contracts
          python -m pytest tests/ -v

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || true
      - name: Lint
        working-directory: frontend
        run: npm run lint || true
      - name: Type check
        working-directory: frontend
        run: npm run type-check || true
      - name: Run tests
        working-directory: frontend
        run: npm test || true
